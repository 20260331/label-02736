services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: student-grade-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=student-grade-management-secret-key-2024
      - JWT_SECRET_KEY=jwt-secret-key-2024
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/auth/check')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务
  frontend:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: student-grade-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  backend-data:
  backend-logs:
